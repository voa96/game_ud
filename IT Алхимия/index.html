<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>IT Алхимия</title>
</head>
<script src="JS.js"></script>
<body>
    <main>
        <div class="main">
        <div class="items_list">
            <div class="openItem">
            <div id="код" class="item open">
                <img src="картинка/код.svg" alt="">
            </div>  
            <div id="дизайн" class="item open">
                <img src="картинка/дизайн.svg" alt="">
            </div>
            <div id="сервер" class="item open">
                <img src="картинка/сервер.svg" alt="">
            </div>
            </div>
            <div class="closeItem">
                <div id="сервер" class="item close">
                    <img src="картинка/сервер.svg" alt="">
            </div>
            <div id="бэкенд" class="item close">
                <img src="картинка/бэкенд.svg" alt="">
            </div>
            </div>
        </div>
        <div class="collection_field">
            <div id="basket">
                <img src="картинка/корзина.svg">
            </div>
        </div>
        </div>
    </main>
</body>
</html>
